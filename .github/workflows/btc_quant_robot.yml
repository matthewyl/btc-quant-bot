name: BTC Options Quant Predictor

# 設定定時觸發器 (Cron Job)
on:
  schedule:
    # 國際標準時間 (UTC) 上午 08:15，剛好對應香港時間 (HKT) 下午 16:15 結算盤
    - cron: '15 8 * * *'
  workflow_dispatch: # 允許你在 GitHub 網頁上點擊按鈕手動強制執行測試

jobs:
  run-predict-model:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 賦予 GitHub Actions 自動讀寫並記憶 30天歷史數據庫的權限

    steps:
    # 1. 複製倉庫裡的程式碼
    - name: Checkout Repository Code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0 # 完整獲取歷史紀錄以更新 CSV

    # 2. 安裝 Python 環境
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. 安裝量化與機器學習必備套件
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas numpy lightgbm scikit-learn

    # 4. 執行全新乾淨的量化模型預測腳本 (金蟬脫殼，徹底繞過舊快取)
    - name: Execute Model Prediction
      run: |
        python robot.py

    # 5. 自動把每天下午更新的 historical_greeks.csv 保存並提交回你的 GitHub (自適應數據庫記憶)
    - name: Commit and Push Historical Data
      run: |
        git config --global user.name "GitHub Quant Bot"
        git config --global user.email "actions@github.com"
        git add historical_greeks.csv || true
        git commit -m "自動更新 30天滾動 Greeks 數據庫 [skip ci]" || true
        git push origin main || true
