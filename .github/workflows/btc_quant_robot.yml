name: BTC Options Quant Predictor

on:
  schedule:
    # 每天 UTC 08:15 = 香港時間 16:15（剛好在 Deribit 08:00 結算後）
    - cron: '15 8 * * *'
  workflow_dispatch:  # 支援 GitHub 網頁手動觸發

jobs:
  run-predict-model:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允許 commit historical_greeks.csv

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy scipy

      - name: Execute Model Prediction
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python robot.py

      - name: Commit and Push Historical Data
        run: |
          git config --global user.name "GitHub Quant Bot"
          git config --global user.email "actions@github.com"
          git pull --rebase origin main || true
          git add historical_greeks.csv || true
          git commit -m "自動更新 Greeks 歷史數據 [skip ci]" || true
          git push origin main || true
